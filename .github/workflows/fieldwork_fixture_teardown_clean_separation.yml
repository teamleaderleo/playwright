name: Fieldwork fixture cleanup separation probe

on:
  pull_request:
    paths:
      - '.github/workflows/fieldwork_fixture_teardown_clean_separation.yml'
      - 'fieldwork-experiments/fixture-teardown-clean-separation/**'
  workflow_dispatch:

concurrency:
  group: fieldwork-fixture-clean-separation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-runner-test:
    name: Ubuntu Node 22
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Apply candidate patch
        run: |
          git apply --check fieldwork-experiments/fixture-teardown-clean-separation/clean-separation.patch
          git apply fieldwork-experiments/fixture-teardown-clean-separation/clean-separation.patch
      - uses: ./.github/actions/run-test
        with:
          node-version: 22
          browsers-to-install: chromium
          bot-name: fieldwork-fixture-clean-separation
          command: >-
            npm run ttest --
            tests/playwright-test/fixture-teardown-resumption.spec.ts
            tests/playwright-test/fixture-teardown-fairness.spec.ts
            tests/playwright-test/fixture-teardown-dependency-safety.spec.ts
            tests/playwright-test/fixture-teardown-cleanup-receipt.spec.ts
            tests/playwright-test/fixture-teardown-afterall-isolation.spec.ts
            --workers=1
