name: Fieldwork fixture cleanup separation probe

on:
  pull_request:
    paths:
      - '.github/workflows/fieldwork_fixture_teardown_clean_separation.yml'
      - 'fieldwork-experiments/fixture-teardown-clean-separation/**'
  workflow_dispatch:

concurrency:
  group: fieldwork-fixture-clean-separation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-runner-test:
    name: Ubuntu Node 22
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Apply candidate patch
        run: |
          patch=fieldwork-experiments/fixture-teardown-clean-separation/clean-separation.patch

          # The generated patch contains stale hunk counts. Recount the other
          # files, but apply the one-line worker-stop change through an exact
          # counted replacement because that hunk does not survive git apply.
          git apply --check --recount --exclude=packages/playwright/src/worker/workerMain.ts "$patch"
          git apply --recount --exclude=packages/playwright/src/worker/workerMain.ts "$patch"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/playwright/src/worker/workerMain.ts')
          text = path.read_text(encoding='utf-8')
          old = "    if (testInfo._isFailure())\n      this._isStopped = true;"
          new = "    if (testInfo._isFailure() || testInfo._hasIncompleteFixtureCleanup)\n      this._isStopped = true;"
          if text.count(old) != 1:
              raise SystemExit('worker stop anchor changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check
      - uses: ./.github/actions/run-test
        with:
          node-version: 22
          browsers-to-install: chromium
          bot-name: fieldwork-fixture-clean-separation
          command: >-
            npm run ttest --
            tests/playwright-test/fixture-teardown-resumption.spec.ts
            tests/playwright-test/fixture-teardown-fairness.spec.ts
            tests/playwright-test/fixture-teardown-dependency-safety.spec.ts
            tests/playwright-test/fixture-teardown-cleanup-receipt.spec.ts
            tests/playwright-test/fixture-teardown-afterall-isolation.spec.ts
            --workers=1
