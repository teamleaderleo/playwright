name: Fieldwork fixture teardown cleanup receipt state matrix

on:
  push:
    branches:
      - fieldwork/fixture-teardown-cleanup-receipt-state-matrix-ci
  pull_request:
    branches:
      - fieldwork/fixture-teardown-cleanup-receipt-state-matrix
  workflow_dispatch:

concurrency:
  group: fieldwork-fixture-teardown-cleanup-receipt-state-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-runner-test:
    name: Cleanup receipt state matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/run-test
        with:
          node-version: 22
          browsers-to-install: chromium
          bot-name: fieldwork-fixture-teardown-cleanup-receipt-state-matrix
          command: >-
            npm run ttest --
            tests/playwright-test/fixture-teardown-resumption.spec.ts
            tests/playwright-test/fixture-teardown-fairness.spec.ts
            tests/playwright-test/fixture-teardown-dependency-safety.spec.ts
            tests/playwright-test/fixture-teardown-cleanup-receipt.spec.ts
            --workers=1
