name: Fieldwork fixture teardown

on:
  push:
    branches:
      - fieldwork/fixture-teardown-ci
  pull_request:
    branches:
      - fieldwork/fixture-teardown-budgeted-fairness
  workflow_dispatch:

concurrency:
  group: fieldwork-fixture-teardown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-runner-tests:
    name: Fixture teardown fairness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/run-test
        with:
          node-version: 22
          browsers-to-install: chromium
          bot-name: fieldwork-fixture-teardown
          command: >-
            npm run ttest --
            tests/playwright-test/fixture-teardown-resumption.spec.ts
            tests/playwright-test/fixture-teardown-fairness.spec.ts
            --workers=1
