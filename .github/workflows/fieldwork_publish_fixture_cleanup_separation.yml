name: Publish Fieldwork fixture cleanup separation source

on:
  push:
    branches:
      - fieldwork/fixture-teardown-clean-separation-source
    paths:
      - .github/workflows/fieldwork_publish_fixture_cleanup_separation.yml
      - .github/workflows/fieldwork_publish_fixture_cleanup_separation_trigger.yml

permissions:
  contents: write

concurrency:
  group: fieldwork-publish-fixture-cleanup-separation
  cancel-in-progress: false

jobs:
  publish-source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: fieldwork/fixture-teardown-clean-separation-source

      - name: Apply tested candidate patch
        run: |
          patch=fieldwork-experiments/fixture-teardown-clean-separation/clean-separation.patch
          git apply --check --recount --exclude=packages/playwright/src/worker/workerMain.ts "$patch"
          git apply --recount --exclude=packages/playwright/src/worker/workerMain.ts "$patch"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/playwright/src/worker/workerMain.ts')
          text = path.read_text(encoding='utf-8')
          old = "    if (testInfo._isFailure())\n      this._isStopped = true;"
          new = "    if (testInfo._isFailure() || testInfo._hasIncompleteFixtureCleanup)\n      this._isStopped = true;"
          if text.count(old) != 1:
              raise SystemExit('worker stop anchor changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check

      - uses: ./.github/actions/run-test
        with:
          node-version: 22
          browsers-to-install: chromium
          bot-name: fieldwork-fixture-clean-separation-source
          command: >-
            npm run ttest --
            tests/playwright-test/fixture-teardown-resumption.spec.ts
            tests/playwright-test/fixture-teardown-fairness.spec.ts
            tests/playwright-test/fixture-teardown-dependency-safety.spec.ts
            tests/playwright-test/fixture-teardown-cleanup-receipt.spec.ts
            tests/playwright-test/fixture-teardown-afterall-isolation.spec.ts
            --workers=1

      - name: Commit source-only candidate
        run: |
          rm -f .github/workflows/fieldwork_fixture_teardown_clean_separation.yml
          rm -f .github/workflows/fieldwork_publish_fixture_cleanup_separation.yml
          rm -f .github/workflows/fieldwork_publish_fixture_cleanup_separation_trigger.yml
          rm -rf fieldwork-experiments/fixture-teardown-clean-separation

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/playwright/src/worker/testInfo.ts \
            packages/playwright/src/worker/fixtureRunner.ts \
            packages/playwright/src/worker/workerMain.ts \
            tests/playwright-test/fixture-teardown-resumption.spec.ts \
            .github/workflows \
            fieldwork-experiments
          git commit -m "fix(runner): separate fixture cleanup safety from result accounting"
          git push origin HEAD:fieldwork/fixture-teardown-clean-separation-source
