name: Fieldwork fixture teardown pre-afterAll recovery

on:
  pull_request:
    branches:
      - fieldwork/fixture-teardown-afterall-isolation-probe
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fieldwork-fixture-teardown-pre-afterall-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fieldwork/fixture-teardown-pre-afterall-recovery
      - name: Apply ordering intervention
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/playwright/src/worker/workerMain.ts')
          text = path.read_text()

          old = """    const afterHooksTimeout = calculateMaxTimeout(this._project.project.timeout, testInfo.timeout);\n    const afterHooksSlot = { timeout: afterHooksTimeout, elapsed: 0 };\n"""
          new = """    const afterHooksTimeout = calculateMaxTimeout(this._project.project.timeout, testInfo.timeout);\n    const afterHooksSlot = { timeout: afterHooksTimeout, elapsed: 0 };\n    // A failed worker gets one bounded full-cleanup budget. Deferred test fixtures\n    // spend from it before afterAll so hook fixture resolution sees fresh instances.\n    const workerCleanupSlot = { timeout: this._project.project.timeout, elapsed: 0 };\n"""
          assert text.count(old) == 1, 'after-hooks slot anchor changed'
          text = text.replace(old, new, 1)

          old = """      try {\n        // Teardown test-scoped fixtures. Attribute to 'test' so that users understand\n        // they should probably increase the test timeout to fix this issue.\n        await this._fixtureRunner.teardownScope('test', testInfo, { type: 'test', slot: afterHooksSlot });\n      } catch (error) {\n        firstAfterHooksError = firstAfterHooksError ?? error;\n      }\n\n      // Run \"afterAll\" hooks for suites that are not shared with the next test.\n"""
          new = """      try {\n        // Teardown test-scoped fixtures. Attribute to 'test' so that users understand\n        // they should probably increase the test timeout to fix this issue.\n        await this._fixtureRunner.teardownScope('test', testInfo, { type: 'test', slot: afterHooksSlot });\n      } catch (error) {\n        firstAfterHooksError = firstAfterHooksError ?? error;\n      }\n\n      // If after hooks left cleanup debt, retry test fixtures before afterAll resolves\n      // its own test-scoped fixtures. Reuse the later Worker Cleanup budget so this\n      // changes ordering without extending the worker shutdown deadline.\n      if (firstAfterHooksError) {\n        try {\n          await this._fixtureRunner.teardownScope('test', testInfo, { type: 'test', slot: workerCleanupSlot });\n        } catch (error) {\n          firstAfterHooksError = firstAfterHooksError ?? error;\n        }\n      }\n\n      // Run \"afterAll\" hooks for suites that are not shared with the next test.\n"""
          assert text.count(old) == 1, 'test fixture teardown anchor changed'
          text = text.replace(old, new, 1)

          old = """        // Give it more time for the full cleanup.\n        const teardownSlot = { timeout: this._project.project.timeout, elapsed: 0 };\n        try {\n          // Attribute to 'test' so that users understand they should probably increate the test timeout to fix this issue.\n          await this._fixtureRunner.teardownScope('test', testInfo, { type: 'test', slot: teardownSlot });\n"""
          new = """        try {\n          // Attribute to 'test' so that users understand they should probably increase the test timeout to fix this issue.\n          await this._fixtureRunner.teardownScope('test', testInfo, { type: 'test', slot: workerCleanupSlot });\n"""
          assert text.count(old) == 1, 'worker cleanup slot anchor changed'
          text = text.replace(old, new, 1)
          text = text.replace("{ type: 'teardown', slot: teardownSlot }", "{ type: 'teardown', slot: workerCleanupSlot }", 1)

          path.write_text(text)
          PY
      - uses: ./.github/actions/run-test
        with:
          node-version: 22
          browsers-to-install: chromium
          bot-name: fieldwork-fixture-teardown-pre-afterall-recovery
          command: >-
            bash -c 'npm run ttest --
            tests/playwright-test/fixture-teardown-resumption.spec.ts
            tests/playwright-test/fixture-teardown-fairness.spec.ts
            tests/playwright-test/fixture-teardown-dependency-safety.spec.ts
            tests/playwright-test/fixture-teardown-cleanup-receipt.spec.ts
            tests/playwright-test/fixture-teardown-afterall-isolation.spec.ts
            --workers=1 &&
            npm run ttest -- tests/playwright-test/timeout.spec.ts
            -g "should run fixture teardown with custom timeout after afterEach timeout"
            --workers=1'
      - name: Commit validated source intervention
        shell: bash
        run: |
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git add packages/playwright/src/worker/workerMain.ts
          git commit -m "fix(runner): recover test fixtures before afterAll"
          git push origin HEAD:fieldwork/fixture-teardown-pre-afterall-recovery
