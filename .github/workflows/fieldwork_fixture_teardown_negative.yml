name: Fieldwork fixture teardown negative control

on:
  push:
    branches:
      - fieldwork/fixture-teardown-negative-ci
  pull_request:
    branches:
      - fieldwork/fixture-teardown-fairness-probe
  workflow_dispatch:

concurrency:
  group: fieldwork-fixture-teardown-negative-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-runner-tests:
    name: Fixture teardown negative control
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/run-test
        with:
          node-version: 22
          browsers-to-install: chromium
          bot-name: fieldwork-fixture-teardown-negative
          command: >-
            npm run ttest --
            tests/playwright-test/fixture-teardown-resumption.spec.ts
            tests/playwright-test/fixture-teardown-fairness.spec.ts
            --workers=1
