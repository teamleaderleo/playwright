name: Fieldwork fixture teardown cross-platform

on:
  push:
    branches:
      - fieldwork/fixture-teardown-cross-platform-ci
  pull_request:
    branches:
      - fieldwork/fixture-teardown-budgeted-fairness
  workflow_dispatch:

concurrency:
  group: fieldwork-fixture-teardown-cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-runner-tests:
    name: Fixture teardown fairness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/run-test
        with:
          node-version: 22
          browsers-to-install: chromium
          bot-name: fieldwork-fixture-teardown-${{ matrix.os }}
          command: >-
            npm run ttest --
            tests/playwright-test/fixture-teardown-resumption.spec.ts
            tests/playwright-test/fixture-teardown-fairness.spec.ts
            --workers=1
