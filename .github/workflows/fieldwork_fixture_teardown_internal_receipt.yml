name: Fieldwork internal fixture cleanup receipt

on:
  push:
    branches:
      - fieldwork/fixture-teardown-internal-receipt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fieldwork-internal-fixture-cleanup-receipt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fieldwork/fixture-teardown-internal-receipt
      - name: Apply receipt convention changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/playwright/src/worker/fixtureRunner.ts')
          text = path.read_text()

          old = "const cleanupReceipt: { name: string, state: Exclude<FixtureTeardownState, 'deferred'> }[] = [];"
          new = "const cleanupReceipt: { id: string, name: string, location: Location, state: Exclude<FixtureTeardownState, 'deferred'> }[] = [];"
          assert text.count(old) == 1, 'receipt type anchor changed'
          text = text.replace(old, new, 1)

          old = "cleanupReceipt.push({ name: fixture.registration.name, state: result.state });"
          new = "cleanupReceipt.push({ id: fixture.registration.id, name: fixture.registration.name, location: fixture.registration.location, state: result.state });"
          assert text.count(old) == 1, 'receipt entry anchor changed'
          text = text.replace(old, new, 1)

          assert text.count("await testInfo.attach('fixture-cleanup', {") == 1, 'receipt attachment anchor changed'
          text = text.replace("await testInfo.attach('fixture-cleanup', {", "await testInfo.attach('_fixture-cleanup', {", 1)

          assert text.count("phase: 'worker-cleanup',") == 1, 'receipt phase anchor changed'
          text = text.replace("phase: 'worker-cleanup',", "phase: 'deferred-test-fixture-recovery',", 1)

          path.write_text(text)
          PY
      - uses: ./.github/actions/run-test
        with:
          node-version: 22
          browsers-to-install: chromium
          bot-name: fieldwork-internal-fixture-cleanup-receipt
          command: >-
            npm run ttest --
            tests/playwright-test/fixture-teardown-resumption.spec.ts
            tests/playwright-test/fixture-teardown-fairness.spec.ts
            tests/playwright-test/fixture-teardown-dependency-safety.spec.ts
            tests/playwright-test/fixture-teardown-cleanup-receipt.spec.ts
            tests/playwright-test/fixture-teardown-afterall-isolation.spec.ts
            --workers=1
      - name: Commit validated receipt changes
        shell: bash
        run: |
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git add packages/playwright/src/worker/fixtureRunner.ts
          git commit -m "fix(runner): make cleanup receipt internal"
          git push origin HEAD:fieldwork/fixture-teardown-internal-receipt
