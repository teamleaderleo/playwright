name: Fieldwork fixture teardown recovery diagnostics

on:
  push:
    branches:
      - fieldwork/fixture-teardown-recovery-diagnostics-ci
  pull_request:
    branches:
      - fieldwork/fixture-teardown-recovery-diagnostics
  workflow_dispatch:

concurrency:
  group: fieldwork-fixture-teardown-recovery-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-runner-test:
    name: Recovery diagnostic regression stack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/run-test
        with:
          node-version: 22
          browsers-to-install: chromium
          bot-name: fieldwork-fixture-teardown-recovery-diagnostics
          command: >-
            npm run ttest --
            tests/playwright-test/fixture-teardown-resumption.spec.ts
            tests/playwright-test/fixture-teardown-fairness.spec.ts
            tests/playwright-test/fixture-teardown-dependency-safety.spec.ts
            tests/playwright-test/fixture-teardown-cleanup-receipt.spec.ts
            --workers=1
